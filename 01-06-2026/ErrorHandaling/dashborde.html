<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>My Dashboard</h2>

        <ul>
            <li>🏠 Home</li>
            <li>👤 Profile</li>
            <li>📊 Reports</li>
            <li>📁 Projects</li>
            <li>⚙ Settings</li>
            <li>🚪 Logout</li>
        </ul>
    </div>

    <!-- Main -->
    <div class="main">

        <header>
            <h1>Dashboard</h1>
            <button>Login</button>
        </header>

        <!-- Cards -->
        <div class="cards">

            <div class="card">
                <h3>Users</h3>
                <p id="users">120</p>
            </div>

            <div class="card">
                <h3>Sales</h3>
                <p>$25,000</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>530</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$80,500</p>
            </div>

        </div>

        <!-- Table -->
        <div class="table-box">

            <h2>Recent Orders</h2>

            <table>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Amount</th>
                </tr>

                <tr>
                    <td>101</td>
                    <td>John</td>
                    <td>Completed</td>
                    <td>$200</td>
                </tr>

                <tr>
                    <td>102</td>
                    <td>Emma</td>
                    <td>Pending</td>
                    <td>$150</td>
                </tr>

                <tr>
                    <td>103</td>
                    <td>David</td>
                    <td>Completed</td>
                    <td>$350</td>
                </tr>

                <tr>
                    <td>104</td>
                    <td>Sophia</td>
                    <td>Cancelled</td>
                    <td>$90</td>
                </tr>

            </table>

        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
